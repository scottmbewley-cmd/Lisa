<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Evelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="monogram"><img src="assets/images/evelle-logo.png" alt="Evelle" style="height:64px;width:auto;"></a>
    <div class="header-right">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="story.html">Story</a>
      <a href="care.html">Care</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="cart-icon-btn" id="cart-toggle" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-badge" id="cart-count">0</span>
    </button>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-frame">
    <span class="eyebrow"><!--CONTACT_EYEBROW--></span>
    <h1><!--CONTACT_HEADING--></h1>
    <p class="muted"><!--CONTACT_SUBTITLE--></p>
  </div>
</section>

<section class="section section-alt">
  <div class="container" style="max-width:560px;">
    <form id="contact-form">
      <div class="field-group">
        <label for="c-name">Name</label>
        <input type="text" id="c-name" required />
      </div>
      <div class="field-group">
        <label for="c-email">Email</label>
        <input type="email" id="c-email" required />
      </div>
      <div class="field-group">
        <label for="c-message">Message</label>
        <textarea id="c-message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
      <p class="muted" style="margin-top:14px; font-size:0.85rem;" id="form-note">This form isn't wired to email delivery yet — placeholder for now.</p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <a href="index.html" class="monogram" style="color:var(--cream);margin-bottom:14px;"><img src="assets/images/evelle-logo.png" alt="Evelle" style="height:64px;width:auto;"></a>
        <p class="muted" style="max-width:320px;">Handmade, hypoallergenic jewellery designed to last.</p>
        <div class="social-row">
          <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 2 .2 2.4.4.6.2 1 .5 1.5 1 .4.4.7.8 1 1.5.2.5.3 1.3.4 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.2 2-.4 2.4-.2.6-.5 1-1 1.5-.4.4-.8.7-1.5 1-.5.2-1.3.3-2.4.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-2-.2-2.4-.4-.6-.2-1-.5-1.5-1-.4-.4-.7-.8-1-1.5-.2-.5-.3-1.3-.4-2.4C2 15.6 2 15.2 2 12s0-3.6.1-4.9c.1-1.2.2-2 .4-2.4.2-.6.5-1 1-1.5.4-.4.8-.7 1.5-1 .5-.2 1.3-.3 2.4-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3a6.8 6.8 0 100 13.6 6.8 6.8 0 000-13.6zm0 2a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6zm7-2.1a1.6 1.6 0 11-3.2 0 1.6 1.6 0 013.2 0z"/></svg></a>
          <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.2-1.5 1.5-1.5H17V3.6C16.7 3.6 15.7 3.5 14.5 3.5c-2.4 0-4 1.5-4 4.2v2.2H7.8V13h2.7v8h3z"/></svg></a>
          <a href="#" aria-label="Whatnot"><span class="w-mark">W</span></a>
        </div>
      </div>
      <div>
        <h4>Shop</h4>
        <a href="shop.html">All Pieces</a>
        <a href="care.html">Jewellery Care</a>
        <a href="contact.html">Contact</a>
      </div>
      <div>
        <h4>Business</h4>
        <a href="story.html">Our Story</a>
        <a href="staff/login.html">Staff Login</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 Evelle. All rights reserved.</span>
      <a href="contact.html">Get in touch</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/cart.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('form-note').textContent = "Thanks — this is a placeholder confirmation. Real email delivery not yet connected.";
});
</script>
</body>
</html>
