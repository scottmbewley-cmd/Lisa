<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Evelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="monogram"><img src="/logo" alt="Evelle" style="height:64px;width:auto;"></a>
    <div class="header-right">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="story.html">Story</a>
      <a href="care.html">Care</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="cart-icon-btn" id="cart-toggle" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-badge" id="cart-count">0</span>
    </button>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-frame">
    <span class="eyebrow"><!--CONTACT_EYEBROW--></span>
    <h1><!--CONTACT_HEADING--></h1>
    <p class="muted"><!--CONTACT_SUBTITLE--></p>
  </div>
</section>

<section class="section section-alt">
  <div class="container" style="max-width:560px;">
    <form id="contact-form">
      <div class="field-group">
        <label for="c-name">Name</label>
        <input type="text" id="c-name" required />
      </div>
      <div class="field-group">
        <label for="c-email">Email</label>
        <input type="email" id="c-email" required />
      </div>
      <div class="field-group">
        <label for="c-message">Message</label>
        <textarea id="c-message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
      <p class="muted" style="margin-top:14px; font-size:0.85rem;" id="form-note">Or email us directly at <a href="mailto:lisa@evellejewellery.co.uk">lisa@evellejewellery.co.uk</a>.</p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-row">
      <a href="index.html" class="monogram" style="color:var(--cream);margin-bottom:0;"><img src="/logo" alt="Evelle" style="height:58px;width:auto;"></a>
      <nav class="footer-links">
        <a href="shop.html">All Pieces</a>
        <a href="story.html">Our Story</a>
        <a href="care.html">Jewellery Care</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="social-row">
        <!--SOCIAL_LINKS-->
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 Evelle. All rights reserved.</span>
      <a href="staff/login.html">Staff Login</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/cart.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  const note = document.getElementById('form-note');
  const name = document.getElementById('c-name').value;
  const email = document.getElementById('c-email').value;
  const message = document.getElementById('c-message').value;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/contact-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, message }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      e.target.reset();
      note.textContent = "Thanks — your message has been sent. We'll get back to you soon.";
      btn.textContent = 'Send Message';
      btn.disabled = false;
      return;
    }
    note.textContent = data.message || "Something went wrong sending your message.";
  } catch (err) {
    note.textContent = "Something went wrong sending your message — please email us directly at lisa@evellejewellery.co.uk.";
  }
  btn.textContent = 'Send Message';
  btn.disabled = false;
});
</script>
</body>
</html>
