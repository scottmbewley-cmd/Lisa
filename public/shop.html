<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Evelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="monogram"><img src="/logo" alt="Evelle" style="height:64px;width:auto;"></a>
    <div class="header-right">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="story.html">Story</a>
      <a href="care.html">Care</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="cart-icon-btn" id="cart-toggle" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-badge" id="cart-count">0</span>
    </button>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section" style="padding-bottom:20px;">
  <div class="container section-header">
    <span class="eyebrow">The full collection</span>
    <h1 style="font-size:clamp(2rem,4vw,3rem);">Shop</h1>
    <p class="muted">This season's pieces, refreshed regularly.</p>
  </div>
</section>

<section class="section" style="padding-top:0; padding-bottom:14px;">
  <div class="container">
    <div class="shop-filter-bar">
      <input type="text" id="shop-search" class="shop-search-input" placeholder="Search by name, type, or stone — try &quot;ruby&quot; or &quot;rings&quot;" />
      <div class="shop-filter-chips">
        <button class="chip active" data-cat="">All</button>
        <button class="chip" data-cat="Ring">Rings</button>
        <button class="chip" data-cat="Bracelet">Bracelets</button>
        <button class="chip" data-cat="Necklace">Necklaces</button>
        <button class="chip" data-cat="Earring">Earrings</button>
        <button class="chip" data-cat="Anklet">Anklets</button>
        <button class="chip" data-cat="Other">Other</button>
      </div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="product-grid" id="product-grid"><!--SHOP_PRODUCTS-->
      <p id="shop-empty-msg" class="muted" style="display:none; grid-column:1/-1;">No pieces match that search — try a different word.</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-row">
      <a href="index.html" class="monogram" style="color:var(--cream);margin-bottom:0;"><img src="/logo" alt="Evelle" style="height:58px;width:auto;"></a>
      <nav class="footer-links">
        <a href="shop.html">All Pieces</a>
        <a href="story.html">Our Story</a>
        <a href="care.html">Jewellery Care</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="social-row">
        <!--SOCIAL_LINKS-->
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 Evelle. All rights reserved.</span>
      <a href="https://mudefordwebdesign.co.uk/" target="_blank" rel="noopener">Website by Mudeford Web Design</a>
      <a href="staff/login.html">Staff Login</a>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/cart.js"></script>

</body>
</html>
