<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Care Content — Evelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/staff-theme.css" />
<script src="../assets/js/staff-common.js"></script>
<style>
  .ce-section { margin-bottom: 40px; }
  #status-msg { font-size: 0.85rem; margin: 16px 0; min-height: 20px; }
  textarea.staff-textarea { width:100%; font-family:'Inter',sans-serif; background:var(--staff-card); color:var(--staff-white); border:1px solid var(--staff-line); border-radius:6px; padding:10px; box-sizing:border-box; }
</style>
</head>
<body class="staff-body">

<header class="staff-header">
  <div class="staff-brand">
    <div class="staff-logo-box"><img src="/logo" alt="Evelle"></div>
    <div>
      <h1 class="staff-serif">Evelle</h1>
      <div class="staff-tagline">Content Editor · The beauty of being you</div>
    </div>
  </div>
  <nav class="staff-nav">
    <a href="content-editor.html">&larr; All Pages</a>
  </nav>
</header>

<main class="staff-main">
  <span class="staff-eyebrow">Staff area</span>
  <h1 class="staff-serif" style="font-size:clamp(2rem,4vw,2.6rem); margin:0 0 10px;">Care Page Content</h1>
  <p class="staff-muted">Changes here go live on the Jewellery Care page immediately after saving.</p>

  <div id="status-msg"></div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Header</h3>
    <div class="staff-field">
      <label>Eyebrow (small label above heading)</label>
      <input type="text" id="f-eyebrow" />
    </div>
    <div class="staff-field">
      <label>Heading</label>
      <input type="text" id="f-heading" />
    </div>
  </div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Section 1</h3>
    <div class="staff-field"><label>Title</label><input type="text" id="f-s1-title" /></div>
    <div class="staff-field"><label>Body</label><textarea id="f-s1-body" rows="3" class="staff-textarea"></textarea></div>
  </div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Section 2</h3>
    <div class="staff-field"><label>Title</label><input type="text" id="f-s2-title" /></div>
    <div class="staff-field"><label>Body</label><textarea id="f-s2-body" rows="3" class="staff-textarea"></textarea></div>
  </div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Section 3</h3>
    <div class="staff-field"><label>Title</label><input type="text" id="f-s3-title" /></div>
    <div class="staff-field"><label>Body</label><textarea id="f-s3-body" rows="3" class="staff-textarea"></textarea></div>
  </div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Closing note</h3>
    <div class="staff-field">
      <label>Small italic line (leave blank to remove)</label>
      <input type="text" id="f-note" />
    </div>
  </div>

  <button class="staff-btn" id="save-btn">Save Changes</button>
</main>

<script>
let careContent = {};

async function loadAll() {
  const res = await fetch('/api/care-content');
  careContent = await res.json();
  document.getElementById('f-eyebrow').value = careContent.eyebrow || '';
  document.getElementById('f-heading').value = careContent.heading || '';
  document.getElementById('f-s1-title').value = careContent.section1_title || '';
  document.getElementById('f-s1-body').value = careContent.section1_body || '';
  document.getElementById('f-s2-title').value = careContent.section2_title || '';
  document.getElementById('f-s2-body').value = careContent.section2_body || '';
  document.getElementById('f-s3-title').value = careContent.section3_title || '';
  document.getElementById('f-s3-body').value = careContent.section3_body || '';
  document.getElementById('f-note').value = careContent.note || '';
}

async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}

const careTracker = staffTrackUnsaved(
  ['f-eyebrow','f-heading','f-s1-title','f-s1-body','f-s2-title','f-s2-body','f-s3-title','f-s3-body','f-note'].map(id => document.getElementById(id)),
  document.getElementById('save-btn')
);

document.getElementById('save-btn').addEventListener('click', async () => {
  const msgEl = document.getElementById('status-msg');
  const saveBtn = document.getElementById('save-btn');
  msgEl.style.color = '';
  saveBtn.disabled = true;
  try {
    const payload = {
      eyebrow: document.getElementById('f-eyebrow').value.trim(),
      heading: document.getElementById('f-heading').value.trim(),
      section1_title: document.getElementById('f-s1-title').value.trim(),
      section1_body: document.getElementById('f-s1-body').value.trim(),
      section2_title: document.getElementById('f-s2-title').value.trim(),
      section2_body: document.getElementById('f-s2-body').value.trim(),
      section3_title: document.getElementById('f-s3-title').value.trim(),
      section3_body: document.getElementById('f-s3-body').value.trim(),
      note: document.getElementById('f-note').value.trim()
    };
    const res = await fetchWithTimeout('/api/care-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }, 15000);
    const data = await res.json();
    if (!res.ok) {
      msgEl.textContent = data.error || 'Something went wrong saving that.';
      msgEl.style.color = 'var(--staff-danger)';
      return;
    }
    msgEl.style.color = 'var(--staff-ok)';
    msgEl.textContent = 'Saved — Care page updated.';
    careTracker.markSaved();
    await loadAll();
  } catch (err) {
    msgEl.textContent = 'Something went wrong: ' + err.message;
    msgEl.style.color = 'var(--staff-danger)';
  } finally {
    saveBtn.disabled = false;
  }
});

loadAll();
</script>
</body>
</html>
