<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Content — Evelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/staff-theme.css" />
<script src="../assets/js/staff-common.js"></script>
<style>
  .ce-section { margin-bottom: 40px; }
  #status-msg { font-size: 0.85rem; margin: 16px 0; min-height: 20px; }
</style>
</head>
<body class="staff-body">

<header class="staff-header">
  <div class="staff-brand">
    <div class="staff-logo-box"><img src="/logo" alt="Evelle"></div>
    <div>
      <h1 class="staff-serif">Evelle</h1>
      <div class="staff-tagline">Content Editor · The beauty of being you</div>
    </div>
  </div>
  <nav class="staff-nav">
    <a href="content-editor.html">&larr; All Pages</a>
  </nav>
</header>

<main class="staff-main">
  <span class="staff-eyebrow">Staff area</span>
  <h1 class="staff-serif" style="font-size:clamp(2rem,4vw,2.6rem); margin:0 0 10px;">Contact Page Content</h1>
  <p class="staff-muted">Changes here go live on the Contact page immediately after saving.</p>

  <div id="status-msg"></div>

  <div class="staff-card ce-section" style="border-top: 2px solid var(--staff-taupe);">
    <h3 class="staff-serif" style="margin-top:0;">Text</h3>
    <div class="staff-field">
      <label>Eyebrow (small label above heading)</label>
      <input type="text" id="f-eyebrow" />
    </div>
    <div class="staff-field">
      <label>Heading</label>
      <input type="text" id="f-heading" />
    </div>
    <div class="staff-field">
      <label>Subtitle</label>
      <textarea id="f-subtitle" rows="2" style="width:100%; font-family:'Inter',sans-serif; background:var(--staff-card); color:var(--staff-white); border:1px solid var(--staff-line); border-radius:6px; padding:10px; box-sizing:border-box;"></textarea>
    </div>
    <p class="staff-muted" style="font-size:0.8rem;">The form fields below (Name / Email / Message) are functional and not editable here.</p>
  </div>

  <button class="staff-btn" id="save-btn">Save Changes</button>
</main>

<script>
let contactContent = {};

async function loadAll() {
  const res = await fetch('/api/contact-content');
  contactContent = await res.json();
  document.getElementById('f-eyebrow').value = contactContent.eyebrow || '';
  document.getElementById('f-heading').value = contactContent.heading || '';
  document.getElementById('f-subtitle').value = contactContent.subtitle || '';
}

async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}

const contactTracker = staffTrackUnsaved(
  [document.getElementById('f-eyebrow'), document.getElementById('f-heading'), document.getElementById('f-subtitle')],
  document.getElementById('save-btn')
);

document.getElementById('save-btn').addEventListener('click', async () => {
  const msgEl = document.getElementById('status-msg');
  const saveBtn = document.getElementById('save-btn');
  msgEl.style.color = '';
  saveBtn.disabled = true;
  try {
    const payload = {
      eyebrow: document.getElementById('f-eyebrow').value.trim(),
      heading: document.getElementById('f-heading').value.trim(),
      subtitle: document.getElementById('f-subtitle').value.trim()
    };
    const res = await fetchWithTimeout('/api/contact-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }, 15000);
    const data = await res.json();
    if (!res.ok) {
      msgEl.textContent = data.error || 'Something went wrong saving that.';
      msgEl.style.color = 'var(--staff-danger)';
      return;
    }
    msgEl.style.color = 'var(--staff-ok)';
    msgEl.textContent = 'Saved — Contact page updated.';
    contactTracker.markSaved();
    await loadAll();
  } catch (err) {
    msgEl.textContent = 'Something went wrong: ' + err.message;
    msgEl.style.color = 'var(--staff-danger)';
  } finally {
    saveBtn.disabled = false;
  }
});

loadAll();
</script>
</body>
</html>
